<div style="margin: 50px">
  <h1>Test International Telephone Input Form</h1>
  <br />
  <div class="wrapper">
    <button type="button" (click)="changePreferredCountries()">
      Change Preferred Countries
    </button>
  </div>
  <div class="wrapper">
    <input
      type="checkbox"
      [checked]="separateDialCode()"
      (change)="separateDialCode.set($any($event.target).checked)"
    />
    <label>&nbsp;Separate Dial Code?</label>
  </div>
  <form novalidate (submit)="$event.preventDefault()">
    <div class="wrapper">
      <ngx-intl-tel-input
        [preferredCountries]="preferredCountries()"
        [enableAutoCountrySelect]="true"
        [enablePlaceholder]="true"
        [searchCountryFlag]="true"
        [searchCountryField]="[
          SearchCountryField.Iso2,
          SearchCountryField.Name,
        ]"
        [selectFirstCountry]="false"
        [selectedCountryISO]="CountryISO.India"
        [separateDialCode]="separateDialCode()"
        [numberFormat]="PhoneNumberFormat.National"
        [formField]="phoneForm.phone"
      >
      </ngx-intl-tel-input>
    </div>
    <div class="wrapper">
      <button type="button" (click)="reset()">Reset</button>
    </div>
  </form>
  <br />
  <div>
    <strong>Is input valid:</strong>
    <pre>{{ phoneForm().valid() }}</pre>
  </div>
  <div>
    <strong>Is input touched:</strong>
    <pre>{{ phoneForm().touched() }}</pre>
  </div>
  <div>
    <strong>Is form valid:</strong>
    <pre>{{ phoneForm().valid() }}</pre>
  </div>
  <div>
    <strong>Form value:</strong>
    <pre>{{ phoneModel().phone | json }}</pre>
  </div>
  <div>
    <strong>Form validation errors:</strong>
    <pre>{{ phoneForm.phone().errors() | json }}</pre>
  </div>
</div>
